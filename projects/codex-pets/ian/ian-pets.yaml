shared_character_lock: |-
  Create one complete, age-appropriate and nonsexualized photoreal human likeness
  of IAN. Preserve the same real-person identity across every pet and animation:
  softly tapered oval face, smooth broad forehead, softly arched brows, almond
  dark eyes, narrow straight nose bridge with a rounded tip, defined cupid's bow,
  fuller lower lip and a small rounded chin. Use natural human head-to-body
  proportions, realistic anatomy, skin, hair strands, fabric and footwear. The
  supplied video frames are the primary face-geometry evidence; stage photos are
  the primary outfit, hairstyle-color and available full-silhouette evidence.
  Keep her fully human, with ordinary human ears, two human arms, clearly formed
  hands and fingers, two human legs and human footwear. Never add animal anatomy.

identity_reference_policy:
  primary_face_anchor: ian_face_front_neutral
  supporting_face_views: [ian_face_three_quarter, ian_face_detail]
  upper_body_anchor: ian_upper_body_front
  evidence_limits: |-
    Neither supplied video contains a true side profile or standing full-body
    view. Do not claim those views as observed. Use the multi-view video frames
    for facial geometry and visible upper-body proportions; use the supplied
    stage photos for outfit construction and the available full-silhouette cues.
    The videos contain warm white balance and visible beauty smoothing, so do not
    copy their skin color, gloss or smoothing as literal anatomy.

shared_avoid:
  - animal or animal-human hybrid
  - animal ears, tail, paws, muzzle, whiskers, claws, wings or horns
  - mascot animal, plush animal or anthropomorphic object
  - sexualized or age-inappropriate styling
  - cartoon, anime, manga, illustration, cel shading or painterly rendering
  - chibi, super-deformed, oversized head or toy-like body proportions
  - vinyl toy, figurine, doll, sticker, mascot, waxy skin or plastic materials
  - generic idol face, beautified face drift or identity changes between frames
  - fabricated profile evidence or invented claims about unseen lower-body proportions
  - readable text, labels, logos, watermarks or copied character branding
  - scenery, floor, cast shadow, glow, aura or detached effects
  - malformed hands, extra fingers, extra limbs, hidden feet or cropped body

