common_animation_personality:
  idle: "Calm breathing, a soft blink and a tiny persona-preserving hair movement."
  running_right: "Readable right-facing human travel cadence with alternating steps."
  running_left: "Readable left-facing human travel cadence with alternating steps."
  waving: "Friendly open human-hand wave; no wave marks or detached effects."
  jumping: "Small vertical hop expressed only through body position."
  failed: "Brief sensitive reaction through brows and shoulders, followed by recovery."
  waiting: "Expectant listening posture that clearly asks for user input or approval."
  running: "Focused task-processing through eyes, posture and restrained hand movement; no literal running."
  review: "Analytical gaze, restrained head tilt and thoughtful hand position; no UI or new prop."

pets:
  - pet_id: ian-azure-navigator
    display_name: "Ian · Azure Navigator"
    status: installed
    style_preset: auto
    identity_references: [ian_face_front_neutral, ian_upper_body_front, ian_face_three_quarter, ian_face_detail]
    outfit_references: [ian_04, ian_05]
    generation_references: [ian_face_front_neutral, ian_face_three_quarter, ian_face_detail, ian_04, ian_05]
    description: "A high-fidelity photoreal human likeness of Ian in navy sailor styling."
    pet_notes: |-
      Create a photoreal miniature full-body human Codex Pet called Azure
      Navigator, preserving Ian's real facial identity from the four video
      anchors. Use natural human proportions, realistic skin and individual
      hair strands, with copper-auburn waist-length stage hair. Her outfit uses
      a broad navy-and-white sailor collar, sky-blue satin bow, one original
      silver heart ornament, structured dark-denim pinafore and a small tilted
      navy sailor cap. Render real fabric weave, stitching and compact navy
      ankle boots. Keep every accessory attached and show one centered,
      head-to-toe real human on a flat removable chroma-key background.
    identity_anchors:
      - Ian's stable real facial geometry from the primary video frames
      - natural human head-to-body proportions with no caricature
      - long copper-auburn hair
      - tilted navy sailor cap
      - broad sailor collar and sky-blue bow
      - dark-denim pinafore
    look_mechanics: |-
      Anchor boots, hips and lower torso. Eyes, eyelids and eyebrows lead;
      the head and neck follow with restrained anatomical motion. Long hair
      follows one step behind with gentle inertia. Preserve skull and facial
      spacing; never rotate the whole sprite or rely on pupil-only motion.

  - pet_id: ian-heartline-noir
    display_name: "Ian · Heartline Noir"
    status: installed
    style_preset: auto
    identity_references: [ian_face_front_neutral, ian_upper_body_front, ian_face_three_quarter, ian_face_detail]
    outfit_references: [ian_01, ian_02]
    generation_references: [ian_face_front_neutral, ian_face_three_quarter, ian_face_detail, ian_01, ian_02]
    description: "A high-fidelity photoreal human likeness of Ian in black, ivory and silver stage styling."
    pet_notes: |-
      Create a photoreal miniature full-body human Codex Pet called Heartline
      Noir, preserving Ian's real facial identity from the four video anchors.
      Use natural human proportions, realistic skin and copper-red hair in a
      high braided bun with soft side bangs and one narrow black ribbon attached
      behind the hair. Dress her in a modest black-and-ivory asymmetric stage
      outfit with one ivory shoulder panel, fitted black bodice, wide ivory belt
      and one original embossed silver heart ornament. Render true fabric,
      metal and black ankle boots with no drawn outlines or cel shading. Place
      one complete centered, head-to-toe real human on a flat removable
      chroma-key background.
    identity_anchors:
      - Ian's stable real facial geometry from the primary video frames
      - natural human head-to-body proportions with no caricature
      - high braided bun and attached black ribbon
      - black-and-ivory asymmetric shoulder panel
      - original silver heart ornament
      - controlled but unusually varied facial acting
    look_mechanics: |-
      Anchor boots and lower torso. Eyes, eyelids and brows initiate direction,
      followed by a small head, neck and shoulder turn. The bun remains stable
      while the attached ribbon lags continuously. Side directions reveal the
      appropriate cheek and partial profile without stretching the face.

  - pet_id: ian-lemon-cadet
    display_name: "Ian · Lemon Cadet"
    status: installed
    style_preset: auto
    identity_references: [ian_face_front_neutral, ian_upper_body_front, ian_face_three_quarter, ian_face_detail]
    outfit_references: [ian_03, ian_06, ian_07]
    generation_references: [ian_face_front_neutral, ian_face_three_quarter, ian_face_detail, ian_06, ian_07]
    description: "A high-fidelity photoreal human likeness of Ian with copper twin-tails and cream-yellow sailor styling."
    pet_notes: |-
      Create a photoreal miniature full-body human Codex Pet called Lemon Cadet,
      preserving Ian's real facial identity from the four video anchors. Use
      natural human proportions, realistic skin and long copper-auburn human
      twin ponytails with center-parted bangs. The ponytails are ordinary human
      hair and never animal ears or tails. Dress her in a modest cream-white
      sailor uniform with pale lemon piping, structured square collar, short
      yellow waist bands and compact pleated skirt. Attach one navy fabric
      rosette with an original abstract silver heart center and no animal
      illustration. Render realistic fabric, hair and cream ankle boots with no
      anime, painterly or cel-shaded treatment. Show one complete centered,
      head-to-toe real human on a flat removable chroma-key background.
    identity_anchors:
      - Ian's stable real facial geometry from the primary video frames
      - natural human head-to-body proportions with no caricature
      - long high human twin ponytails
      - cream-white and pale-lemon sailor uniform
      - navy rosette with original abstract heart center
      - playful energy-source expression
    look_mechanics: |-
      Anchor boots, skirt and lower torso. Eyes and eyelids lead, followed by
      restrained head and neck motion. Both ponytails remain attached at fixed
      human hair ties and lag smoothly; they must never behave like animal
      appendages. Preserve facial proportions and use no whole-body rotation.

