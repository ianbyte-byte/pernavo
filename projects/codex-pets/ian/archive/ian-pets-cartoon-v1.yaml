common_animation_personality:
  idle: "Calm breathing, a soft blink and a tiny persona-preserving hair movement."
  running_right: "Readable right-facing human travel cadence with alternating steps."
  running_left: "Readable left-facing human travel cadence with alternating steps."
  waving: "Friendly open human-hand wave; no wave marks or detached effects."
  jumping: "Small vertical hop expressed only through body position."
  failed: "Brief sensitive reaction through brows and shoulders, followed by recovery."
  waiting: "Expectant listening posture that clearly asks for user input or approval."
  running: "Focused task-processing through eyes, posture and restrained hand movement; no literal running."
  review: "Analytical gaze, restrained head tilt and thoughtful hand position; no UI or new prop."

pets:
  - pet_id: ian-azure-navigator
    display_name: "Ian · Azure Navigator"
    status: installed
    style_preset: 3d-toy
    references: [ian_04, ian_05]
    description: "A warm, expressive human navigator in navy sailor styling."
    pet_notes: |-
      Create a compact full-body human Codex Pet called Azure Navigator.
      Give her warm copper-auburn waist-length human hair, a softly rounded
      face, bright dark eyes, human hands and compact navy ankle boots. Her
      outfit uses a broad navy-and-white sailor collar, sky-blue satin bow,
      one original silver heart ornament, structured dark-denim pinafore and
      a small tilted navy sailor cap. Render her as a premium soft-vinyl 3D
      collectible with an oversized expressive head, compact body, smooth
      materials and details readable in a 192x208 cell. Keep every accessory
      attached and show one centered head-to-toe human character on a flat
      removable chroma-key background.
    identity_anchors:
      - long copper-auburn hair
      - tilted navy sailor cap
      - broad sailor collar and sky-blue bow
      - dark-denim pinafore
    look_mechanics: |-
      Anchor boots, hips and lower torso. Eyes, eyelids and eyebrows lead;
      the head and neck follow with restrained anatomical motion. Long hair
      follows one step behind with gentle inertia. Preserve skull and facial
      spacing; never rotate the whole sprite or rely on pupil-only motion.

  - pet_id: ian-heartline-noir
    display_name: "Ian · Heartline Noir"
    status: installed
    style_preset: sticker
    references: [ian_01, ian_02]
    description: "An elegant human stage character built around black, ivory and a silver heart cue."
    pet_notes: |-
      Create a compact full-body human Codex Pet called Heartline Noir.
      Give her copper-red hair in a high braided bun with soft side bangs and
      one narrow black ribbon attached behind the hair. Use large dark eyes,
      a poised smile, clear human hands and black ankle boots. Dress her in a
      modest graphic black-and-ivory asymmetric stage outfit with one ivory
      shoulder panel, fitted black bodice, wide ivory belt and one original
      embossed silver heart ornament. Render as a premium illustrated sticker
      with crisp outlines, clean cel shading, oversized expressive head and
      compact whole-body proportions. Place one complete centered human on a
      flat removable chroma-key background.
    identity_anchors:
      - high braided bun and attached black ribbon
      - black-and-ivory asymmetric shoulder panel
      - original silver heart ornament
      - controlled but unusually varied facial acting
    look_mechanics: |-
      Anchor boots and lower torso. Eyes, eyelids and brows initiate direction,
      followed by a small head, neck and shoulder turn. The bun remains stable
      while the attached ribbon lags continuously. Side directions reveal the
      appropriate cheek and partial profile without stretching the face.

  - pet_id: ian-lemon-cadet
    display_name: "Ian · Lemon Cadet"
    status: installed
    style_preset: painterly
    references: [ian_03, ian_06, ian_07]
    description: "A lively human cadet with copper twin-tails and cream-yellow sailor styling."
    pet_notes: |-
      Create a compact full-body human Codex Pet called Lemon Cadet. She has
      long copper-auburn human twin ponytails, center-parted bangs, lively dark
      eyes, rosy cheeks, visible human hands and cream ankle boots. The twin
      ponytails are ordinary human hair and never animal ears or tails. Dress
      her in a modest cream-white sailor uniform with pale lemon piping,
      structured square collar, short yellow waist bands and compact pleated
      skirt. Attach one navy fabric rosette with an original abstract silver
      heart center and no animal illustration. Render as a polished painterly
      anime-game sprite with clean edges, compact body and large readable
      costume shapes on a flat removable chroma-key background.
    identity_anchors:
      - long high human twin ponytails
      - cream-white and pale-lemon sailor uniform
      - navy rosette with original abstract heart center
      - playful energy-source expression
    look_mechanics: |-
      Anchor boots, skirt and lower torso. Eyes and eyelids lead, followed by
      restrained head and neck motion. Both ponytails remain attached at fixed
      human hair ties and lag smoothly; they must never behave like animal
      appendages. Preserve facial proportions and use no whole-body rotation.

