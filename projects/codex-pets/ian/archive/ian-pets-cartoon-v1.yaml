shared_character_lock: |-
  Create one complete, age-appropriate and nonsexualized teenage human idol avatar.
  She is fully human, with ordinary human ears, two human arms, clearly formed
  human hands and fingers, two human legs and human footwear. Preserve warm
  copper-auburn hair, bright dark eyes, a softly rounded face, expressive brows,
  subtle rosy cheeks and an unusually readable range of facial expressions.
  Her personality is emotionally perceptive, people-loving, positive, playful,
  fan-minded and hardworking for the stage. Let a trace of pre-camera nerves
  become focused enjoyment and confident warmth. Never add animal anatomy.

shared_avoid:
  - animal or animal-human hybrid
  - animal ears, tail, paws, muzzle, whiskers, claws, wings or horns
  - mascot animal, plush animal or anthropomorphic object
  - sexualized or age-inappropriate styling
  - photoreal portrait or exact photo reconstruction
  - readable text, labels, logos, watermarks or copied character branding
  - scenery, floor, cast shadow, glow, aura or detached effects
  - malformed hands, extra fingers, extra limbs, hidden feet or cropped body

